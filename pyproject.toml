[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "OctoPrint-HappyHareMMU"
version = "0.1.0"
description = "Live view, control and print-safe error handling for a Happy Hare MMU on Klipper, without Moonraker"
readme = "README.md"
requires-python = ">=3.7"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Luix333" }]
keywords = ["octoprint", "klipper", "happy hare", "mmu", "ercf", "tradrack", "box turtle"]
dependencies = []

[project.urls]
Homepage = "https://github.com/Luix333/OctoPrint-HappyHareMMU"

[project.entry-points."octoprint.plugin"]
happyhare = "octoprint_happyhare"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["octoprint_happyhare*"]

[tool.setuptools.package-data]
octoprint_happyhare = ["templates/*.jinja2", "static/js/*.js", "static/css/*.css"]
